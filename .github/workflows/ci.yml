name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify theme files
        run: python3 scripts/check_theme.py

      - name: Verify generated theme folders
        run: python3 scripts/build_themes.py --check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install lint tooling
        run: npm ci

      # FreshRSS lints every theme under p/themes/ with this configuration, so the
      # source is held to it here rather than at the door of a pull request.
      - name: Verify CSS conventions
        run: npm run --silent stylelint

      # FreshRSS runs svgo over every SVG with this configuration and fails on any change.
      - name: Verify optimised icons
        run: npm run --silent svgo && git diff --exit-code
